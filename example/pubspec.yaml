name: macbear_3d_example
description: Example for macbear_3d
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  macbear_3d:
    path: ../   # pub.dev 會自動處理
  rapier_physics: ^0.5.3
  vector_math: ^2.4.2
  video_player: ^2.11.1

  material_ui: ^1.0.0
  build: ^4.0.10

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/example/
    - assets/notofonts/
